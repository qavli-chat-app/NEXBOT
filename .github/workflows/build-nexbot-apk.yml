name: Build NEXBOT Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-apk/**'
      - '.github/workflows/build-nexbot-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p mobile-apk assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXBOT-PRO-Android-APK
          path: mobile-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
